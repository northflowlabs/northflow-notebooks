name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you need
      description: The problem you want solved, in your own terms.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested approach
      description: How you would solve it, if you have an idea.
